<div style="padding: 26px 32px 44px;">
          <h1 style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: #022746; margin: 0 0 4px;">Modération des contenus</h1>
          <p style="font-size: 14px; color: #66768A; margin: 0 0 20px;">18 éléments en file, dont 7 signalements « IA générative » et 4 tentatives de sortie de plateforme.</p>

          <div style="display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;">
            <sc-for list="{{ modFilters }}" as="f" hint-placeholder-count="5">
              <button sc-camel-on-click="{{ f.onClick }}" style="{{ f.style }}">{{ f.label }}</button>
            </sc-for>
          </div>

          <div style="display: flex; flex-direction: column; gap: 14px;">
            <sc-for list="{{ signalements }}" as="s" hint-placeholder-count="5">
              <div style="border: 1px solid #E8ECF1; border-radius: 12px; padding: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 20px;">
                  <div style="flex: 1;">
                    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                      <span style="{{ s.motifStyle }}">{{ s.motif }}</span>
                      <span style="font-size: 13px; color: #8496A8;">{{ s.source }} · {{ s.when }}</span>
                    </div>
                    <div style="font-size: 16px; color: #14202C; margin: 10px 0 6px;">{{ s.title }}</div>
                    <div style="font-size: 14px; color: #66768A;">{{ s.who }} · {{ s.where }}</div>
                    <p style="font-size: 14px; color: #4A5A6B; line-height: 1.6; margin: 12px 0 0; background: #FBFCFE; border-left: 3px solid #E1E7ED; padding: 12px 14px;">{{ s.extrait }}</p>
                  </div>
                  <div style="width: 168px; display: flex; flex-direction: column; gap: 8px;">
                    <button style="background: #022746; color: #FFF; border: 0; height: 40px; border-radius: 8px; font-size: 14px;">Ouvrir le dossier</button>
                    <button style="background: #FFF; color: #D85D3F; border: 1px solid #F4DFD8; height: 40px; border-radius: 8px; font-size: 14px;">Retirer le contenu</button>
                    <button style="background: #FFF; color: #66768A; border: 1px solid #E1E7ED; height: 40px; border-radius: 8px; font-size: 14px;">Classer sans suite</button>
                    <div style="font-size: 12px; color: #A8B6C4; text-align: center; margin-top: 2px;">{{ s.risque }}</div>
                  </div>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
