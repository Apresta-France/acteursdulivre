<div style="padding: 44px;">
        <div style="max-width: 700px; margin-bottom: 34px;">
          <h1 style="font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700; color: #022746; margin: 0 0 12px;">Centre d'aide</h1>
          <div style="display: flex; align-items: center; background: #F4F6F9; border: 1px solid #E1E7ED; border-radius: 10px; padding: 0 6px 0 16px; height: 52px;">
            <input placeholder="annulation, facture, TVA, niveaux…" style="flex: 1; background: transparent; border: 0; outline: none; font-size: 15px; color: #14202C;">
            <button style="background: #022746; border: 0; color: #FFF; height: 38px; padding: 0 20px; border-radius: 7px; font-size: 14px;">Rechercher</button>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 40px;">
          <sc-for list="{{ aideCats }}" as="c" hint-placeholder-count="4">
            <div style="border: 1px solid #E8ECF1; border-radius: 12px; padding: 20px; cursor: pointer;" style-hover="border-color: #D85D3F;">
              <div style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; color: #022746; font-weight: 500;">{{ c.title }}</div>
              <div style="font-size: 14px; color: #66768A; margin-top: 6px; line-height: 1.5;">{{ c.desc }}</div>
              <div style="font-family: 'Space Grotesk', monospace; font-size: 12px; color: #A8B6C4; margin-top: 12px;">{{ c.n }} articles</div>
            </div>
          </sc-for>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 340px; gap: 34px; align-items: start;">
          <div>
            <h2 style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; color: #022746; margin: 0 0 14px;">Questions fréquentes</h2>
            <div style="border: 1px solid #E8ECF1; border-radius: 14px; overflow: hidden;">
              <sc-for list="{{ aideFaq }}" as="f" hint-placeholder-count="5">
                <div style="border-bottom: 1px solid #F2F5F8;">
                  <div sc-camel-on-click="{{ f.onClick }}" style="padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 15px; color: #14202C;">
                    {{ f.q }}<span style="color: #8496A8; font-family: 'Space Grotesk', monospace;">{{ f.sign }}</span>
                  </div>
                  <sc-if value="{{ f.open }}" hint-placeholder-val="{{ false }}">
                    <div style="padding: 0 18px 18px; font-size: 15px; color: #4A5A6B; line-height: 1.65; max-width: 62em;">{{ f.a }}</div>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </div>
          <div style="border: 1px solid #E8ECF1; border-radius: 14px; padding: 22px;">
            <div style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 500; color: #022746; margin-bottom: 10px;">Nous écrire</div>
            <p style="font-size: 14px; color: #66768A; line-height: 1.6; margin: 0 0 14px;">Une équipe basée en France, du lundi au vendredi, 9 h – 18 h. Réponse moyenne : 4 h.</p>
            <button style="background: #D85D3F; color: #FFF; border: 0; width: 100%; height: 44px; border-radius: 9px; font-size: 15px; font-weight: 500;">Ouvrir un ticket</button>
            <button style="background: #FFF; color: #022746; border: 1px solid #E1E7ED; width: 100%; height: 42px; border-radius: 9px; font-size: 14px; margin-top: 10px;">Signaler un abus</button>
          </div>
        </div>
      </div>
