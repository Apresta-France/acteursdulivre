<div style="padding: 60px 44px; display: flex; justify-content: center;">
        <div style="width: 420px;">
          <h1 style="font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; color: #022746; margin: 0 0 8px;">Se connecter</h1>
          <p style="font-size: 15px; color: #66768A; margin: 0 0 24px;">Un seul compte pour commander et pour proposer vos services.</p>
          <div style="display: flex; flex-direction: column; gap: 16px;">
            <div>
              <label style="display: block; font-size: 14px; font-weight: 500; color: #022746; margin-bottom: 8px;">E-mail</label>
              <input placeholder="vous@exemple.fr" style="width: 100%; box-sizing: border-box; border: 1px solid #E1E7ED; border-radius: 9px; padding: 13px 14px; font-size: 15px; outline: none;">
            </div>
            <div>
              <label style="display: block; font-size: 14px; font-weight: 500; color: #022746; margin-bottom: 8px;">Mot de passe</label>
              <input placeholder="••••••••••" style="width: 100%; box-sizing: border-box; border: 1px solid #E1E7ED; border-radius: 9px; padding: 13px 14px; font-size: 15px; outline: none;">
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px;">
              <label style="display: flex; gap: 8px; align-items: center; color: #4A5A6B;"><span style="width: 15px; height: 15px; border: 1.5px solid #C3CEDA; border-radius: 3px; display: block;"></span>Rester connecté</label>
              <span style="color: #D85D3F; cursor: pointer;">Mot de passe oublié ?</span>
            </div>
            <button sc-camel-on-click="{{ login }}" style="background: #D85D3F; color: #FFF; border: 0; height: 50px; border-radius: 9px; font-size: 16px; font-weight: 500;">Se connecter</button>
            <div style="text-align: center; font-size: 14px; color: #66768A;">Pas encore de compte ? <span sc-camel-on-click="{{ goInscription }}" style="color: #D85D3F; cursor: pointer;">Créer un compte</span></div>
          </div>
        </div>
      </div>
