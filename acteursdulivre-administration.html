document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

26 · fuseau Europe/Paris<\u002Fp>\n\n          <div style=\"display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 24px;\">\n            <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"5\">\n              <div style=\"border: 1px solid #E8ECF1; border-radius: 12px; padding: 16px;\">\n                <div style=\"font-size: 13px; color: #8496A8;\">{{ k.k }}<\u002Fdiv>\n                <div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 25px; font-weight: 700; color: #022746; margin-top: 6px;\">{{ k.v }}<\u002Fdiv>\n                <div style=\"{{ k.deltaStyle }}\">{{ k.d }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: 1fr 380px; gap: 24px; align-items: start;\">\n            <div style=\"display: flex; flex-direction: column; gap: 22px;\">\n              <div style=\"border: 1px solid #E8ECF1; border-radius: 12px; padding: 20px;\">\n                <div style=\"display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px;\">\n                  <span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 500; color: #022746;\">Inscriptions prestataires · 8 semaines<\u002Fspan>\n                  <div style=\"display: flex; gap: 14px; font-size: 13px; color: #66768A;\">\n                    <span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"width: 9px; height: 9px; border-radius: 2px; background: #022746; display: block;\"><\u002Fspan>validés<\u002Fspan>\n                    <span style=\"display: flex; gap: 6px; align-items: center;\"><span style=\"width: 9px; height: 9px; border-radius: 2px; background: #D85D3F; display: block;\"><\u002Fspan>en attente<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display: flex; align-items: flex-end; gap: 14px; height: 150px;\">\n   <\u002Fdiv>\n\n              <div style=\"border: 1px solid #E8ECF1; border-radius: 12px; padding: 20px;\">\n                <div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 500; color: #022746; margin-bottom: 14px;\">Activité récente<\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n                  <sc-for list=\"{{ activite }}\" as=\"a\" hint-placeholder-count=\"6\">\n                    <div style=\"display: flex; gap: 10px; align-items: flex-start;\">\n                      <span style=\"{{ a.dot }}\"><\u002Fspan>\n                      <div style=\"flex: 1;\">\n                        <div style=\"font-size: 14px; color: #14202C; line-height: 1.45;\">{{ a.txt }}<\u002Fdiv>\n                        <div style=\"font-size: 12px; color: #8496A8; margin-top: 3px;\">{{ a.who }} · {{ a.when }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ VÉRIFICATIONS ============ -->\n      <sc-if value=\"{{ isVerif }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding: 26px 32px 44px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;\">\n            <div>\n              <h1 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: #022746; margin: 0 0 4px;\">Vérification des prestataires<\u002Fh1>\n              <p style=\"font-size: 14px; color: #66768A; margin: 0;\">24 dossiers en attente · délai moyen de traitement 9 h<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 8px;\">\n              <sc-for list=\"{{ verifFilters }}\" as=\"f\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: 1fr 420px; gap: 24px; align-items: start;\">\n            <div style=\"border: 1px solid #E8ECF1; border-radius: 12px; overflow: hidden;\">\n              <sc-for list=\"{{ dossiers }}\" as=\"d\" hint-placeholder-count=\"6\">\n                <div sc-camel-on-click=\"{{ d.onClick }}\" style=\"{{ d.row }}\">\n                  <span style=\"{{ d.avatar }}\">{{ d.initials }}<\u002Fspan>\n                  <div style=\"flex: 1;\">\n                    <div style=\"display: flex; align-items: center; gap: 9px;\">\n                      <span style=\"font-size: 15px; color: #14202C;\">{{ d.name }}<\u002Fspan>\n                      <span style=\"{{ d.tagStyle }}\">{{ d.tag }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 13px; color: #66768A; margin-top: 3px;\">{{ d.role }} · déposé {{ d.when }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"text-align: right;\">\n                    <div style=\"font-family: 'Space Grotesk', monospace; font-size: 13px; color: #8496A8;\">{{ d.pieces }}<\u002Fdiv>\n                    <div style=\"font-size: 12px; color: #A8B6C4; margin-top: 4px;\">{{ d.metier }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"border: 1px solid #E8ECF1; border-radius: 12px; padding: 22px; position: sticky; top: 20px;\">\n              <div style=\"display: flex; align-items: center; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid #EEF1F5;\">\n                <span style=\"{{ dossierAvatar }}\">{{ dossierInitials }}<\u002Fspan>\n                <div style=\"flex: 1;\">\n                  <div style=\"font-size: 17px; color: #14202C;\">{{ dossierName }}<\u002Fdiv>\n                  <div style=\"font-size: 13px; color: #66768A;\">{{ dossierRole }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display: flex; flex-direction: column; gap: 11px; padding: 18px 0; border-bottom: 1px solid #EEF1F5;\">\n                <sc-for list=\"{{ dossierMeta }}\" as=\"m\" hint-placeholder-count=\"5\">\n                  <div style=\"display: flex; justify-content: space-between; font-size: 14px;\"><span style=\"color: #8496A8;\">{{ m.k }}<\u002Fspan><span style=\"color: #14202C;\">{{ m.v }}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"padding: 18px 0; border-bottom: 1px solid #EEF1F5;\">\n                <div style=\"font-family: 'Space Grotesk', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #8496A8; margin-bottom: 12px;\">Pièces déposées<\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n                  <sc-for list=\"{{ dossierPieces }}\" as=\"p\" hint-placeholder-count=\"4\">\n                    <div style=\"display: flex; align-items: center; gap: 10px; border: 1px solid #E8ECF1; border-radius: 9px; padding: 11px 13px;\">\n                      <span style=\"font-family: 'Space Grotesk', monospace; font-size: 10px; color: #FFF; background: #022746; padding: 3px 6px; border-radius: 3px;\">{{ p.ext }}<\u002Fspan>\n                      <span style=\"flex: 1; font-size: 14px; color: #14202C;\">{{ p.name }}<\u002Fspan>\n                      <span style=\"{{ p.okStyle }}\">{{ p.ok }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"padding: 18px 0;\">\n                <div style=\"font-family: 'Space Grotesk', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #8496A8; margin-bottom: 12px;\">Points de contrôle<\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n                  <sc-for list=\"{{ controles }}\" as=\"c\" hint-placeholder-count=\"5\">\n                    <div sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.row }}\">\n                      <span style=\"{{ c.box }}\">{{ c.check }}<\u002Fspan>\n                      <span style=\"flex: 1; font-size: 14px; color: #14202C;\">{{ c.label }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <textarea placeholder=\"Note interne — visible par l'équipe de modération uniquement\" style=\"width: 100%; box-sizing: border-box; height: 76px; border: 1px solid #E1E7ED; border-radius: 9px; padding: 11px 12px; font-size: 14px; outline: none; resize: none; line-height: 1.55;\"><\u002Ftextarea>\n              <div style=\"display: flex; gap: 10px; margin-top: 14px;\">\n                <button style=\"background: #022746; color: #FFF; border: 0; flex: 1; height: 44px; border-radius: 9px; font-size: 15px; font-weight: 500;\">Valider le profil<\u002Fbutton>\n                <button style=\"background: #FFF; color: #022746; border: 1px solid #E1E7ED; height: 44px; padding: 0 16px; border-radius: 9px; font-size: 14px;\">Demander une pièce<\u002Fbutton>\n                <button style=\"background: #FFF; color: #D85D3F; border: 1px solid #F4DFD8; height: 44px; padding: 0 16px; border-radius: 9px; font-size: 14px;\">Refuser<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ MODÉRATION / SIGNALEMENTS ============ -->\n      <sc-if value=\"{{ isModeration }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding: 26px 32px 44px;\">\n          <h1 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: #022746; margin: 0 0 4px;\">Modération des contenus<\u002Fh1>\n          <p style=\"font-size: 14px; color: #66768A; margin: 0 0 20px;\">18 éléments en file, dont 7 signalements « IA générative » et 4 tentatives de sortie de plateforme.<\u002Fp>\n\n          <div style=\"display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;\">\n            <sc-for list=\"{{ modFilters }}\" as=\"f\" hint-placeholder-count=\"5\">\n              <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n            <sc-for list=\"{{ signalements }}\" as=\"s\" hint-placeholder-count=\"5\">\n              <div style=\"border: 1px solid #E8ECF1; border-radius: 12px; padding: 20px;\">\n                <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 20px;\">\n                  <div style=\"flex: 1;\">\n                    <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap;\">\n                      <span style=\"{{ s.motifStyle }}\">{{ s.motif }}<\u002Fspan>\n                      <span style=\"font-size: 13px; color: #8496A8;\">{{ s.source }} · {{ s.when }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 16px; color: #14202C; margin: 10px 0 6px;\">{{ s.title }}<\u002Fdiv>\n                    <div style=\"font-size: 14px; color: #66768A;\">{{ s.who }} · {{ s.where }}<\u002Fdiv>\n                    <p style=\"font-size: 14px; color: #4A5A6B; line-height: 1.6; margin: 12px 0 0; background: #FBFCFE; border-left: 3px solid #E1E7ED; padding: 12px 14px;\">{{ s.extrait }}<\u002Fp>\n                  <\u002Fdiv>\n                  <div style=\"width: 168px; display: flex; flex-direction: column; gap: 8px;\">\n                    <button style=\"background: #022746; color: #FFF; border: 0; height: 40px; border-radius: 8px; font-size: 14px;\">Ouvrir le dossier<\u002Fbutton>\n                    <button style=\"background: #FFF; color: #D85D3F; border: 1px solid #F4DFD8; height: 40px; border-radius: 8px; font-size: 14px;\">Retirer le contenu<\u002Fbutton>\n                    <button style=\"background: #FFF; color: #66768A; border: 1px solid #E1E7ED; height: 40px; border-radius: 8px; font-size: 14px;\">Classer sans suite<\u002Fbutton>\n                    <div style=\"font-size: 12px; color: #A8B6C4; text-align: center; margin-top: 2px;\">{{ s.risque }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ UTILISATEURS ============ -->\n      <sc-if value=\"{{ isUsers }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding: 26px 32px 44px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;\">\n            <div>\n              <h1 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: #022746; margin: 0 0 4px;\">Utilisateurs<\u002Fh1>\n              <p style=\"font-size: 14px; color: #66768A; margin: 0;\">5 890 prestataires · 1 412 porteurs de projet · 38 comptes organisation<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 10px;\">\n              <button style=\"background: #FFF; border: 1px solid #E1E7ED; color: #022746; height: 40px; padding: 0 16px; border-radius: 8px; font-size: 14px;\">Exporter<\u002Fbutton>\n              <button style=\"background: #022746; color: #FFF; border: 0; height: 40px; padding: 0 16px; border-radius: 8px; font-size: 14px;\">Inviter un utilisateur<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap;\">\n            <sc-for list=\"{{ userFilters }}\" as=\"f\" hint-placeholder-count=\"5\">\n              <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"border: 1px solid #E8ECF1; border-radius: 12px; overflow: hidden;\">\n            <div style=\"display: grid; grid-template-columns: 1fr 150px 110px 110px 110px 120px; gap: 14px; padding: 13px 18px; background: #FBFCFE; border-bottom: 1px solid #EEF1F5; font-size: 13px; color: #8496A8;\">\n              <span>Utilisateur<\u002Fspan><span>Métier<\u002Fspan><span>Niveau<\u002Fspan><span>Missions<\u002Fspan><span>Note<\u002Fspan><span>Statut<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ users }}\" as=\"u\" hint-placeholder-count=\"8\">\n              <div style=\"display: grid; grid-template-columns: 1fr 150px 110px 110px 110px 120px; gap: 14px; padding: 14px 18px; border-bottom: 1px solid #F2F5F8; align-items: center; font-size: 14px; cursor: pointer;\" style-hover=\"background: #FBFCFE;\">\n                <div style=\"display: flex; align-items: center; gap: 10px;\">\n                  <span style=\"{{ u.avatar }}\">{{ u.initials }}<\u002Fspan>\n                  <div>\n                    <div style=\"font-size: 15px; color: #14202C;\">{{ u.name }}<\u002Fdiv>\n                    <div style=\"font-size: 12px; color: #8496A8; margin-top: 2px;\">{{ u.email }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"color: #4A5A6B;\">{{ u.metier }}<\u002Fspan>\n                <span style=\"color: #4A5A6B;\">{{ u.niveau }}<\u002Fspan>\n                <span style=\"font-family: 'Space Grotesk', monospace; color: #4A5A6B;\">{{ u.missions }}<\u002Fspan>\n                <span style=\"font-family: 'Space Grotesk', monospace; color: #D85D3F;\">{{ u.note }}<\u002Fspan>\n                <span><span style=\"{{ u.statutStyle }}\">{{ u.statut }}<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ CATALOGUE ============ -->\n      <sc-if value=\"{{ isCatalogue }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding: 26px 32px 44px;\">\n          <h1 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: #022746; margin: 0 0 4px;\">Catalogue des prestations<\u002Fh1>\n          <p style=\"font-size: 14px; color: #66768A; margin: 0 0 20px;\">2 314 prestations en ligne · 41 en attente de première publication<\u002Fp>\n          <div style=\"border: 1px solid #E8ECF1; border-radius: 12px; overflow: hidden;\">\n            <div style=\"display: grid; grid-template-columns: 1fr 160px 110px 100px 110px 130px; gap: 14px; padding: 13px 18px; background: #FBFCFE; border-bottom: 1px solid #EEF1F5; font-size: 13px; color: #8496A8;\">\n              <span>Prestation<\u002Fspan><span>Prestataire<\u002Fspan><span>Prix<\u002Fspan><span>Vues<\u002Fspan><span>Commandes<\u002Fspan><span>Statut<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ catalogue }}\" as=\"c\" hint-placeholder-count=\"7\">\n              <div style=\"display: grid; grid-template-columns: 1fr 160px 110px 100px 110px 130px; gap: 14px; padding: 14px 18px; border-bottom: 1px solid #F2F5F8; align-items: center; font-size: 14px;\">\n                <div>\n                  <div style=\"font-size: 15px; color: #14202C;\">{{ c.title }}<\u002Fdiv>\n                  <div style=\"font-size: 12px; color: #8496A8; margin-top: 3px;\">{{ c.metier }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"color: #4A5A6B;\">{{ c.by }}<\u002Fspan>\n                <span style=\"font-family: 'Space Grotesk', monospace; color: #022746;\">{{ c.prix }}<\u002Fspan>\n                <span style=\"font-family: 'Space Grotesk', monospace; color: #4A5A6B;\">{{ c.vues }}<\u002Fspan>\n                <span style=\"font-family: 'Space Grotesk', monospace; color: #4A5A6B;\">{{ c.cmd }}<\u002Fspan>\n                <span><span style=\"{{ c.statutStyle }}\">{{ c.statut }}<\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ MISSIONS ============ -->\n      <sc-if value=\"{{ isMissions }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding: 26px 32px 44px;\">\n          <h1 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: #022746; margin: 0 0 4px;\">Appels d'offres<\u002Fh1>\n          <p style=\"font-size: 14px; color: #66768A; margin: 0 0 20px;\">148 missions ouvertes · 12 à modérer avant publication · 6 signalées « budget hors marché »<\u002Fp>\n          <div style=\"border: 1px solid #E8ECF1; border-radius: 12px; overflow: hidden;\">\n            <sc-for list=\"{{ missions }}\" as=\"m\" hint-placeholder-count=\"6\">\n              <div style=\"display: grid; grid-template-columns: 1fr 140px 120px 110px 190px; gap: 16px; align-items: center; padding: 15px 18px; border-bottom: 1px solid #F2F5F8;\">\n                <div>\n                  <div style=\"display: flex; align-items: center; gap: 9px;\">\n                    <span style=\"font-size: 15px; color: #14202C;\">{{ m.title }}<\u002Fspan>\n                    <span style=\"{{ m.flagStyle }}\">{{ m.flag }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size: 13px; color: #8496A8; margin-top: 3px;\">{{ m.by }} · {{ m.metier }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font-family: 'Space Grotesk', monospace; font-size: 14px; color: #022746;\">{{ m.budget }}<\u002Fspan>\n                <span style=\"font-size: 13px; color: #66768A;\">{{ m.candidatures }} candidatures<\u002Fspan>\n                <span style=\"font-size: 13px; color: #66768A;\">{{ m.when }}<\u002Fspan>\n                <div style=\"display: flex; gap: 8px; justify-content: flex-end;\">\n                  <button style=\"background: #022746; color: #FFF; border: 0; height: 36px; padding: 0 14px; border-radius: 7px; font-size: 13px;\">Publier<\u002Fbutton>\n                  <button style=\"background: #FFF; color: #66768A; border: 1px solid #E1E7ED; height: 36px; padding: 0 12px; border-radius: 7px; font-size: 13px;\">Éditer<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ COMMANDES & FINANCES ============ -->\n      <sc-if value=\"{{ isFinances }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding: 26px 32px 44px;\">\n          <h1 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: #022746; margin: 0 0 4px;\">Commandes et finances<\u002Fh1>\n          <p style=\"font-size: 14px; color: #66768A; margin: 0 0 22px;\">Août 2026 · les montants sont hors taxes<\u002Fp>\n\n          <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px;\">\n            <sc-for list=\"{{ finKpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <div style=\"{{ k.card }}\">\n                <div style=\"font-size: 13px; opacity: .8;\">{{ k.k }}<\u002Fdiv>\n                <div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; margin-top: 6px;\">{{ k.v }}<\u002Fdiv>\n                <div style=\"font-size: 13px; opacity: .75; margin-top: 4px;\">{{ k.note }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: 1fr 340px; gap: 24px; align-items: start;\">\n            <div style=\"border: 1px solid #E8ECF1; border-radius: 12px; overflow: hidden;\">\n              <div style=\"padding: 15px 18px; border-bottom: 1px solid #EEF1F5; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 500; color: #022746;\">Dernières commandes<\u002Fdiv>\n              <div style=\"display: grid; grid-template-columns: 110px 1fr 130px 110px 120px; gap: 14px; padding: 12px 18px; background: #FBFCFE; border-bottom: 1px solid #EEF1F5; font-size: 13px; color: #8496A8;\">\n                <span>Nº<\u002Fspan><span>Prestation<\u002Fspan><span>Montant<\u002Fspan><span>Commission<\u002Fspan><span>Règlement<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ commandes }}\" as=\"c\" hint-placeholder-count=\"7\">\n                <div style=\"display: grid; grid-template-columns: 110px 1fr 130px 110px 120px; gap: 14px; padding: 14px 18px; border-bottom: 1px solid #F2F5F8; align-items: center; font-size: 14px;\">\n                  <span style=\"font-family: 'Space Grotesk', monospace; color: #8496A8;\">{{ c.num }}<\u002Fspan>\n                  <div>\n                    <div style=\"color: #14202C;\">{{ c.title }}<\u002Fdiv>\n                    <div style=\"font-size: 12px; color: #8496A8; margin-top: 3px;\">{{ c.parties }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font-family: 'Space Grotesk', monospace; color: #022746;\">{{ c.montant }}<\u002Fspan>\n                  <span style=\"font-family: 'Space Grotesk', monospace; color: #D85D3F;\">{{ c.commission }}<\u002Fspan>\n                  <span><span style=\"{{ c.statutStyle }}\">{{ c.statut }}<\u002Fspan><\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n              <div style=\"border: 1px solid #E8ECF1; border-radius: 12px; padding: 20px;\">\n                <div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 500; color: #022746; margin-bottom: 14px;\">Impayés à relancer<\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n                  <sc-for list=\"{{ impayes }}\" as=\"i\" hint-placeholder-count=\"3\">\n                    <div style=\"display: flex; justify-content: space-between; align-items: center; font-size: 14px;\">\n                      <div>\n                        <div style=\"color: #14202C;\">{{ i.who }}<\u002Fdiv>\n                        <div style=\"font-size: 12px; color: #8496A8; margin-top: 2px;\">{{ i.retard }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <span style=\"font-family: 'Space Grotesk', monospace; color: #D85D3F;\">{{ i.montant }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <button style=\"background: #022746; color: #FFF; border: 0; width: 100%; height: 40px; border-radius: 8px; font-size: 14px; margin-top: 16px;\">Envoyer les relances<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"border: 1px solid #E8ECF1; border-radius: 12px; padding: 20px;\">\n                <div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 500; color: #022746; margin-bottom: 12px;\">Commission par métier<\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n                  <sc-for list=\"{{ commissionMetier }}\" as=\"c\" hint-placeholder-count=\"5\">\n                    <div>\n                      <div style=\"display: flex; justify-content: space-between; font-size: 14px;\"><span style=\"color: #4A5A6B;\">{{ c.metier }}<\u002Fspan><span style=\"font-family: 'Space Grotesk', monospace; color: #022746;\">{{ c.montant }}<\u002Fspan><\u002Fdiv>\n                      <div style=\"height: 5px; background: #EEF1F5; border-radius: 3px; margin-top: 7px; overflow: hidden;\"><div style=\"{{ c.bar }}\"><\u002Fdiv><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ LITIGES ============ -->\n      <sc-if value=\"{{ isLitiges }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding: 26px 32px 44px;\">\n          <h1 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: #022746; margin: 0 0 4px;\">Litiges et médiation<\u002Fh1>\n          <p style=\"font-size: 14px; color: #66768A; margin: 0 0 22px;\">4 dossiers ouverts · délai d'intervention garanti 72 h<\u002Fp>\n\n          <div style=\"display: grid; grid-template-columns: 340px 1fr; gap: 24px; align-items: start;\">\n            <div style=\"border: 1px solid #E8ECF1; border-radius: 12px; overflow: hidden;\">\n              <sc-for list=\"{{ litiges }}\" as=\"l\" hint-placeholder-count=\"4\">\n                <div sc-camel-on-click=\"{{ l.onClick }}\" style=\"{{ l.row }}\">\n                  <div style=\"display: flex; justify-content: space-between; align-items: baseline;\">\n                    <span style=\"font-family: 'Space Grotesk', monospace; font-size: 12px; color: #8496A8;\">{{ l.num }}<\u002Fspan>\n                    <span style=\"{{ l.urgenceStyle }}\">{{ l.urgence }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size: 15px; color: #14202C; margin-top: 8px; line-height: 1.4;\">{{ l.title }}<\u002Fdiv>\n                  <div style=\"font-size: 13px; color: #8496A8; margin-top: 5px;\">{{ l.parties }} · {{ l.montant }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"border: 1px solid #E8ECF1; border-radius: 12px; padding: 24px;\">\n              <div style=\"display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 18px; border-bottom: 1px solid #EEF1F5;\">\n                <div>\n                  <div style=\"font-family: 'Space Grotesk', monospace; font-size: 12px; color: #8496A8;\">{{ litigeNum }}<\u002Fdiv>\n                  <div style=\"font-size: 19px; color: #022746; margin-top: 6px;\">{{ litigeTitle }}<\u002Fdiv>\n                  <div style=\"font-size: 14px; color: #66768A; margin-top: 5px;\">{{ litigeParties }} · commande {{ litigeCommande }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"text-align: right;\">\n                  <div style=\"font-size: 13px; color: #8496A8;\">Montant en jeu<\u002Fdiv>\n                  <div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; color: #022746;\">{{ litigeMontant }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"padding: 18px 0; border-bottom: 1px solid #EEF1F5;\">\n                <div style=\"font-family: 'Space Grotesk', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #8496A8; margin-bottom: 12px;\">Chronologie<\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n                  <sc-for list=\"{{ litigeTimeline }}\" as=\"t\" hint-placeholder-count=\"4\">\n                    <div style=\"display: grid; grid-template-columns: 90px 1fr; gap: 14px; font-size: 14px;\">\n                      <span style=\"font-family: 'Space Grotesk', monospace; color: #8496A8;\">{{ t.when }}<\u002Fspan>\n                      <div>\n                        <div style=\"color: #14202C;\">{{ t.label }}<\u002Fdiv>\n                        <div style=\"font-size: 13px; color: #66768A; margin-top: 3px; line-height: 1.5;\">{{ t.note }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"padding: 18px 0;\">\n                <div style=\"font-family: 'Space Grotesk', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #8496A8; margin-bottom: 12px;\">Décision proposée<\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n                  <sc-for list=\"{{ decisions }}\" as=\"d\" hint-placeholder-count=\"4\">\n                    <div sc-camel-on-click=\"{{ d.onClick }}\" style=\"{{ d.row }}\">\n                      <span style=\"{{ d.dot }}\"><\u002Fspan>\n                      <div style=\"flex: 1;\">\n                        <div style=\"font-size: 15px; color: #14202C;\">{{ d.label }}<\u002Fdiv>\n                        <div style=\"font-size: 13px; color: #8496A8; margin-top: 2px;\">{{ d.note }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <textarea placeholder=\"Motivation de la décision — transmise aux deux parties\" style=\"width: 100%; box-sizing: border-box; height: 90px; border: 1px solid #E1E7ED; border-radius: 9px; padding: 12px 13px; font-size: 14px; outline: none; resize: none; line-height: 1.55; margin-top: 14px;\"><\u002Ftextarea>\n                <div style=\"display: flex; gap: 10px; margin-top: 14px;\">\n                  <button style=\"background: #D85D3F; color: #FFF; border: 0; height: 46px; padding: 0 22px; border-radius: 9px; font-size: 15px; font-weight: 500;\">Notifier la décision<\u002Fbutton>\n                  <button style=\"background: #FFF; color: #022746; border: 1px solid #E1E7ED; height: 46px; padding: 0 18px; border-radius: 9px; font-size: 15px;\">Demander une pièce<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ AVIS ============ -->\n      <sc-if value=\"{{ isAvis }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding: 26px 32px 44px;\">\n          <h1 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: #022746; margin: 0 0 4px;\">Avis signalés<\u002Fh1>\n          <p style=\"font-size: 14px; color: #66768A; margin: 0 0 20px;\">Un avis n'est publiable qu'après une mission réellement facturée. 5 contestations en attente.<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n            <sc-for list=\"{{ avisSignales }}\" as=\"a\" hint-placeholder-count=\"4\">\n              <div style=\"border: 1px solid #E8ECF1; border-radius: 12px; padding: 20px; display: grid; grid-template-columns: 1fr 180px; gap: 22px; align-items: start;\">\n                <div>\n                  <div style=\"display: flex; align-items: center; gap: 10px;\">\n                    <span style=\"{{ a.motifStyle }}\">{{ a.motif }}<\u002Fspan>\n                    <span style=\"font-family: 'Space Grotesk', monospace; font-size: 13px; color: #D85D3F;\">★ {{ a.note }}<\u002Fspan>\n                    <span style=\"font-size: 13px; color: #8496A8;\">{{ a.when }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <p style=\"font-size: 15px; color: #14202C; line-height: 1.6; margin: 12px 0 8px;\">{{ a.txt }}<\u002Fp>\n                  <div style=\"font-size: 13px; color: #66768A;\">{{ a.auteur }} → {{ a.cible }} · {{ a.mission }}<\u002Fdiv>\n                  <p style=\"font-size: 14px; color: #4A5A6B; line-height: 1.6; margin: 12px 0 0; background: #FBFCFE; border-left: 3px solid #E1E7ED; padding: 12px 14px;\">Contestation : {{ a.contestation }}<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n                  <button style=\"background: #022746; color: #FFF; border: 0; height: 40px; border-radius: 8px; font-size: 14px;\">Maintenir l'avis<\u002Fbutton>\n                  <button style=\"background: #FFF; color: #D85D3F; border: 1px solid #F4DFD8; height: 40px; border-radius: 8px; font-size: 14px;\">Supprimer<\u002Fbutton>\n                  <button style=\"background: #FFF; color: #66768A; border: 1px soli         <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ JOURNAL / CMS ============ -->\n      <sc-if value=\"{{ isCms }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding: 26px 32px 44px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;\">\n            <div>\n              <h1 style=\"font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: #022746; margin: 0 0 4px;\">Journal et pages du site<\u002Fh1>\n              <p style=\"font-size: 14px; color: #66768A; margin: 0;\">14 articles publiés · 3 brouillons · 6 pages statiques<\u002Fp>\n            <\u002Fdiv>\n            <button style=\"background: #022746; color: #FFF; border: 0; height: 40px; padding: 0 16px; border-radius: 8px; font-size: 14px;\">Nouvel article<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"border: 1px solid #E8ECF1; border-radius: 12px; overflow: hidden;\">\n            <div style=\"display: grid; grid-template-columns: 1fr 130px 130px 110px 120px; gap: 14px; padding: 13px 18px; background: #FBFCFE; border-bottom: 1px solid #EEF1F5; font-size: 13px; color: #8496A8;\">\n              <span>Titre<\u002Fspan><span>Rubrique<\u002Fspan><span>Auteur<\u002Fspan><span>Vues<\u002Fspan><span>Statut<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ articles }}\" as=\"a\" hint-placeholder-count=\"6\">\n              <div style=\"display: grid; grid-template-columns: 1fr 130px 130px 110px 120px; gap: 14px; padding: 14px 18px; border-bottom: 1px solid #F2F5F8; align-items: center; font-size: 14px; cursor: pointer;\" style-hover=\"background: #FBFCFE;\">\n                <div style=\"color: #14202C;\">{{ a.title }}<\u002Fdiv>\n                <span style=\"color: #4A5A6B;\">{{ a.cat }}<\u002Fspan>\n                <span style=\"color: #4A5A6B;\">{{ a.auteur }}<\u002Fspan>\n                <span style=\"font-family: 'Space Grotesk' ne; font-family: 'Space Grotesk', monospace;\">\n                      <span style=\"font-size: 13px; color: #8496A8;\">{{ c.seuil }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"border: 1.5px solid #F4DFD8; background: #FDF3F0; border-radius: 12px; padding: 20px;\">\n                <div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 16px; color: #022746; margin-bottom: 6px;\">Politique IA générative<\u002Fdiv>\n                <p style=\"font-size: 14px; color: #4A5A6B; line-height: 1.6; margin: 0 0 16px;\">Interdiction stricte des livrables générés. Ces réglages pilotent l'engagement signé à l'inscription et les sanctions automatiques.<\u002Fp>\n                <div style=\"display: flex; flex-direction: column; gap: 11px;\">\n                  <sc-for list=\"{{ iaReglages }}\" as=\"i\" hint-placeholder-count=\"4\">\n                    <div sc-camel-on-click=\"{{ i.onClick }}\" style=\"display: flex; justify-content: space-between; align-items: center; background: #FFF; border: 1px solid #F4DFD8; border-radius: 10px; padding: 13px 15px; cursor: pointer;\">\n                      <div>\n                        <div style=\"font-size: 14px; color: #14202C;\">{{ i.label }}<\u002Fdiv>\n                        <div style=\"font-size: 13px; color: #8496A8; margin-top: 2px;\">{{ i.note }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <span style=\"{{ i.track }}\"><span style=\"{{ i.knob }}\"><\u002Fspan><\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"border: 1px solid #E8ECF1; border-radius: 12px; padding: 20px;\">\n                <div style=\"font-family: 'Space Grotesk', sans-serif; font-size: 16px; color: #022746; margin-bottom: 14px;\">Métiers ouverts à l'inscription<\u002Fdiv>\n
